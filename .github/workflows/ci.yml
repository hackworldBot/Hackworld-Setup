name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  bash:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt

      - name: ShellCheck
        run: shellcheck install.sh lib/*.sh modules/*.sh

      - name: Format check
        run: shfmt -d .